name: Fix roadmap count
on:
  push:
    branches: [lane/ci/pr-body-current]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/ci/pr-body-current
      - name: Fix roadmap and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ROADMAP.md
          sed -i 's|836/1500|838/1500|' docs/ROADMAP.md
          git rm .github/workflows/fix-roadmap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -F - <<'MSG'
          ### Changes (Was ist neu)

          - Die Roadmap-Fortschrittszahl steht jetzt bei 838/1500 Textbausteinen.

          ### Technische Basis & Kausalität

          - #346 ergänzt zwei registrierte Narrative-Bausteine; die kompilierte Registry enthält 838 Fragmente, das Register nannte noch 836.
          - Der Test bleibt unverändert und vergleicht weiterhin den echten Registry-Stand; korrigiert wurde nur die veraltete Zahl.

          ### Ausblick (Nächste Schritte)

          - Neuen CI-Lauf auf dem exakten Kopf abwarten und #346 mergen.
          MSG
          git push origin HEAD:lane/ci/pr-body-current
