name: CI Verify

# Ebene A des Main-Gates. "Fail-Closed Gates" ist der Pflichtstatus aus dem
# Branch-Schutz von `main`; er bleibt ein Aggregat, waehrend jedes Gate in der
# Matrix einen eigenen Status traegt. Ein roter Lauf nennt damit das Gate, das
# rot ist, statt "irgendetwas in verify:all".
#
# Der Zustand entscheidet, was laeuft: PR, MAIN und MANUAL tragen das zentrale
# Required-Set und die vollstaendige Suite, LIGHT nur die schnellen Gates,
# NOOP und PR_HANDOFF pruefen nichts. Eine leere Matrix ist ausschliesslich in
# diesen beiden Zustaenden zulaessig; UNKNOWN faellt auf das volle Profil.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      state: ${{ steps.gates.outputs.state }}
      profile: ${{ steps.gates.outputs.profile }}
      matrix: ${{ steps.gates.outputs.matrix }}
      required: ${{ steps.gates.outputs.required }}
      run: ${{ steps.gates.outputs.run }}
      noop: ${{ steps.gates.outputs.noop }}
      independent: ${{ steps.control.outputs.independent }}
      tests: ${{ steps.gates.outputs.test_files }}
      long_count: ${{ steps.gates.outputs.long_count || '0' }}
      long_matrix: ${{ steps.gates.outputs.long_matrix || '{"include":[{"file":""}]}' }}
      long_tests: ${{ steps.gates.outputs.long_tests || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Die Pruefsteuerung kommt aus der Basis, nicht aus dem geprueften PR:
      # sonst koennte der PR Planer, Gate-Auswahl und Claim-Pruefung selbst
      # umschreiben und einen gruenen Status ohne Pruefung erzeugen. Der
      # PR-Baum bleibt das Pruefobjekt (`RBD_ROOT`).
      #
      # Ein PR ohne Diff (Kopf ist die Basis) ist ein echter No-op. Statt hart
      # abzubrechen, wird er als solcher ausgewiesen: `noop=true` und
      # `independent=false`. Der Aggregat-Job akzeptiert diese Kombination nur
      # im Zustand NOOP, nie als gewoehnliche Pruefung.
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || '' }}
          MAIN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          # Auf main ist der gepushte Commit bereits der vertrauenswuerdige
          # Stand. Die alte Basis wuerde die neue Steuerung um einen Lauf
          # verzoegern; PRs behalten die Basis als unabhaengige Kontrollebene.
          if [ "$MAIN_REF" = "refs/heads/main" ]; then base="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          noop=false
          independent=true
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            noop=true
            independent=false
            echo "::notice::Kontrollebene und Pruefobjekt sind derselbe Commit; echter No-op ohne unabhaengige Kontrollebene."
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          # Die Kontrollebene muss RBD_ROOT kennen. Ein stiller Fallback auf
          # die PR-Skripte wuerde die Vertrauensgrenze umgehen.
          if ! grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "::error::Basis ${base} kennt RBD_ROOT nicht; Branch auf einen aktuellen main-Stand rebasen."
            exit 1
          fi
          echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
          echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "noop=$noop" >> "$GITHUB_OUTPUT"
          echo "independent=$independent" >> "$GITHUB_OUTPUT"

      # Der Plan liest Testkatalog und Importgraph; beide brauchen `typescript`.
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Kein zweiter voller Lauf fuer denselben Commit: sobald ein PR offen ist,
      # ist der PR-Lauf die Wahrheit. Der Zustand wird PR_HANDOFF; dieser Lauf
      # erzeugt bewusst keinen Pflichtstatus.
      - name: Doppelten Lauf vermeiden
        id: dedupe
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$number" ]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$number existiert; der PR-Lauf prueft vollstaendig, dieser Push-Lauf endet hier."
          else
            echo "handoff=false" >> "$GITHUB_OUTPUT"
          fi

      # Der Diff, den dieser Lauf wirklich prueft: PR Base gegen Head, Push
      # Before gegen Commit. Ohne belastbaren Bereich bleibt es beim Zustand
      # UNKNOWN und damit beim vollen Profil (siehe ci-plan.mjs); ein leerer
      # Plan wird nie still gruen.
      - name: Basis und Kopf bestimmen
        id: range
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "event=pull_request" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "event=push" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "event=$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          fi

      # Eine Quelle fuer Zustand, Gates und Tests: derselbe `ci-plan` wie das
      # Profil in `verify`. `RBD_VERIFY_AUDIT=1` gilt fuer manuelle Laeufe auch
      # hier, damit der Plan Audit nicht wegkuerzt, bevor die Gates ihn fahren.
      - name: Gate-Matrix aus Zustand
        id: gates
        env:
          EVENT: ${{ steps.range.outputs.event }}
          HEAD_REF: ${{ github.ref }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          NOOP: ${{ steps.control.outputs.noop }}
          HANDOFF: ${{ steps.dedupe.outputs.handoff || 'false' }}
          RBD_VERIFY_AUDIT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: |
          node "${{ steps.control.outputs.scripts }}/ci-plan.mjs" \
            --event="$EVENT" \
            --ref="$HEAD_REF" \
            --base="$BASE" \
            --head="$HEAD" \
            --noop="$NOOP" \
            --handoff="$HANDOFF" \
            --github-output="$GITHUB_OUTPUT"

      # Eine leere Matrix ist nur in NOOP und PR_HANDOFF der Vertrag. In jedem
      # anderen Zustand muss das Required-Set vollstaendig in der Matrix stehen;
      # sonst waere ein Status gruen, ohne dass ein Gate gelaufen ist.
      - name: Matrix validieren
        env:
          MATRIX: ${{ steps.gates.outputs.matrix }}
          REQUIRED: ${{ steps.gates.outputs.required }}
          STATE: ${{ steps.gates.outputs.state }}
        run: |
          echo "::notice::Zustand ${STATE}, Matrix-Laenge ${#MATRIX}"
          node -e 'const raw = process.env.MATRIX ?? ""; let m; try { m = JSON.parse(raw); } catch (error) { console.error("::error::Gate-Matrix ist kein JSON: " + error.message + " :: " + raw); process.exit(1); } const include = Array.isArray(m.include) ? m.include : null; if (!include) { console.error("::error::Gate-Matrix ohne include-Liste: " + raw); process.exit(1); } const state = process.env.STATE ?? ""; const required = (process.env.REQUIRED ?? "").split(",").filter(Boolean); const gates = include.map((entry) => entry.gate).filter(Boolean); const noop = state === "NOOP" || state === "PR_HANDOFF"; if (noop) { if (gates.length > 0) { console.error("::error::Zustand " + state + " darf keine Gates tragen: " + gates.join(", ")); process.exit(1); } console.log("Zustand " + state + ": leere Matrix ist der Vertrag."); process.exit(0); } if (gates.length === 0) { console.error("::error::Zustand " + state + " ohne Gate-Matrix"); process.exit(1); } const missing = required.filter((gate) => !gates.includes(gate)); if (missing.length > 0) { console.error("::error::Required-Gates fehlen in der Matrix: " + missing.join(", ")); process.exit(1); } console.log("Zustand " + state + ": " + gates.length + " Gate(s), required " + required.length + " vollstaendig.");'

      # Klein und maschinenlesbar: welcher Diff, welcher Zustand, welche Gates,
      # welche Tests, was bewusst ausgelassen wurde. Kein Log-Friedhof.
      - name: CI-Plan-Artefakt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-plan
          path: .verify-cache/ci-plan.json
          if-no-files-found: ignore
          retention-days: 7

  # Ein Job je Gate. `fail-fast: false` laesst die anderen Gates fertig laufen:
  # ein roter Lint soll den Testnachweis nicht abschneiden. Dieser Job traegt
  # das Required-Set und laeuft in PR, MAIN, MANUAL und UNKNOWN.
  gate:
    name: Gate ${{ matrix.gate }}
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.state != 'LIGHT'
    runs-on: ubuntu-24.04
    # Grosszuegig: die CI ist die Werkstatt. Ein Abbruch oder Timeout ist
    # REMOTE_CI (Lauf wiederholen), kein roter Stand und kein BLOCKED.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Die Pruefsteuerung kommt aus der Basis, nicht aus dem geprueften PR.
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || '' }}
          MAIN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$MAIN_REF" = "refs/heads/main" ]; then base="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          if ! grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "::error::Basis ${base} kennt RBD_ROOT nicht; Branch auf einen aktuellen main-Stand rebasen."
            exit 1
          fi
          echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
          echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      # Der Gate-Cache liegt ausserhalb von node_modules, weil pnpm install
      # --frozen-lockfile node_modules neu aufbaut. Innen entscheidet der
      # Inhalts-Hash des Arbeitsbaums, ob ein Gate wirklich gruen war.
      - name: Gate-Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ matrix.gate }}-${{ hashFiles('pnpm-lock.yaml', 'src/Config/eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-${{ matrix.gate }}-
            ${{ runner.os }}-rbd-verify-

      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Vollstaendige 22er-Linie, nicht der harte Minor: jsdom und eslint
          # verlangen einen aktuellen 22er-Stand, sonst stirbt der Vitest-Worker.
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Genau ein Gate, kein zweiter Lauf der ganzen Pipeline. Ist das Gate
      # nicht Teil des Profils, bricht der Schritt ab, statt still zu bestehen.
      # `RBD_TEST_FILES` kommt aus dem Impact-Plan; ohne Auswahl (volles
      # Profil, unklarer Diff) laeuft die Suite vollstaendig.
      - name: Gate ${{ matrix.gate }}
        env:
          RBD_TEST_FILES: ${{ needs.plan.outputs.tests }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          # Manuelle Laeufe zwingen Audit, auch wenn der Impact ihn nicht sieht.
          RBD_VERIFY_AUDIT: ${{ needs.plan.outputs.state == 'MANUAL' && '1' || '' }}
          # Die Testsuite ist Pruefobjekt: ihre Fixtures liegen absolut unter
          # /tmp und duerfen nicht unter .rbd-control gehaengt werden. Nur die
          # Node-Gates kommen aus der Kontrollebene.
          RBD_CONTROL_ROOT: ${{ matrix.gate != 'tests' && steps.control.outputs.control || '' }}
        run: node "${{ steps.control.outputs.scripts }}/run-pipeline.mjs" --profile=${{ needs.plan.outputs.profile }} --gate=${{ matrix.gate }}

      - name: Gate-Protokoll bei Rot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-log-${{ matrix.gate }}
          path: .verify-cache/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Der Light-Zustand hat einen eigenen Job und einen eigenen Status. Er traegt
  # nie das Required-Set; sein Gruen ist schnelles Feedback fuer einen
  # Feature-Push, nicht die Merge-Freigabe.
  light:
    name: Light Gates
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.state == 'LIGHT'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || '' }}
          MAIN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$MAIN_REF" = "refs/heads/main" ]; then base="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          if ! grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "::error::Basis ${base} kennt RBD_ROOT nicht; Branch auf einen aktuellen main-Stand rebasen."
            exit 1
          fi
          echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
          echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Gate-Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-light-${{ matrix.gate }}-${{ hashFiles('pnpm-lock.yaml', 'src/Config/eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-light-${{ matrix.gate }}-
            ${{ runner.os }}-rbd-verify-light-

      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Gate ${{ matrix.gate }}
        env:
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: node "${{ steps.control.outputs.scripts }}/run-pipeline.mjs" --profile=light --gate=${{ matrix.gate }}

      - name: Gate-Protokoll bei Rot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: light-log-${{ matrix.gate }}
          path: .verify-cache/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Der Impact-Plan nennt die langen Testdateien bereits. Sie laufen als eigene
  # Matrix auf dem exakten PR-Kopf; jede Datei bekommt einen sichtbaren Job.
  # Die schweren Vollnachweise (Balance, Benchmarks) bleiben im manuellen bzw.
  # woechentlichen `long-checks.yml`, damit ein PR nicht die ganze Nacht laeuft.
  long:
    name: Long ${{ matrix.file }}
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.state != 'LIGHT' && needs.plan.outputs.long_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.long_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Auch der lange Nachweis darf seinen Runner nicht aus dem PR nehmen.
      # Die Testdateien bleiben der PR-Baum, das Testkommando kommt aus der Basis.
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || '' }}
          MAIN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$MAIN_REF" = "refs/heads/main" ]; then base="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          if ! grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "::error::Basis ${base} kennt RBD_ROOT nicht; Branch auf einen aktuellen main-Stand rebasen."
            exit 1
          fi
          echo "::notice::Kontrollebene aus ${base}"
          echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
          echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1
      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Langen Nachweis ausfuehren
        env:
          RBD_TEST_FILES: ${{ matrix.file }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_NARRATIVE_LONGRUN: '1'
          RBD_BALANCE: '1'
          RBD_SOAK: '1'
          RBD_SOAK_TICKS: '100000'
          RBD_REQUIRE_TESTS: '1'
        run: node "${{ steps.control.outputs.scripts }}/run-selected-tests.mjs"

  # Die Claim-Sperre greift auch dort, wo kein Hook laeuft: Cloud-Agenten und
  # GitHub-Codespaces haben `.githooks` nicht aktiv. Geprueft wird der PR-Diff
  # gegen die Basis, inklusive Meta-Sperre und Kollisionen. Nur ein echter
  # PR-Zustand hat einen Diff, den Claims pruefen koennten.
  claims:
    name: Lane Claims
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.state == 'PR'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || '' }}
          MAIN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$MAIN_REF" = "refs/heads/main" ]; then base="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          if ! grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "::error::Basis ${base} kennt RBD_ROOT nicht; Branch auf einen aktuellen main-Stand rebasen."
            exit 1
          fi
          echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
          echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Lane-Claims (Allowlist, Owner, Kollisionen)
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: |
          set -euo pipefail
          scripts="${{ steps.control.outputs.scripts }}"
          node "$scripts"/verify-lane-claims.mjs --ci

  # Commit-Notes gehoeren zum Push auf main. Feature-Branches prueft
  # `pr-escalation.yml`; hier laeuft der Job nur im Zustand MAIN.
  commitmsg:
    name: Commit- und PR-Notes
    needs: plan
    if: needs.plan.outputs.state == 'MAIN'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.sha) || '' }}
          MAIN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$MAIN_REF" = "refs/heads/main" ]; then base="$GITHUB_SHA"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          if ! grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "::error::Basis ${base} kennt RBD_ROOT nicht; Branch auf einen aktuellen main-Stand rebasen."
            exit 1
          fi
          echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
          echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Commit-Notes-Gate
        env:
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: |
          node "${{ steps.control.outputs.scripts }}/verify-commit-msg.mjs" --head

  # Der Pflichtstatus bleibt genau einer. Er fuehrt nur Ergebnisse zusammen und
  # prueft selbst nichts. Was gruen heissen darf, haengt am Zustand: das
  # Required-Set muss wirklich gelaufen sein, ein No-op darf hoechstens
  # uebersprungen sein. Ein PR_HANDOFF erzeugt bewusst keinen Status.
  verify:
    name: Fail-Closed Gates
    needs: [plan, gate, light, long, claims, commitmsg]
    if: always() && needs.plan.outputs.state != 'PR_HANDOFF'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Gate-Ergebnisse zusammenfuehren
        env:
          STATE: ${{ needs.plan.outputs.state }}
          NOOP: ${{ needs.plan.outputs.noop }}
          INDEPENDENT: ${{ needs.plan.outputs.independent }}
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gate.result }}
          LIGHT: ${{ needs.light.result }}
          LONG: ${{ needs.long.result }}
          CLAIMS: ${{ needs.claims.result }}
          COMMITMSG: ${{ needs.commitmsg.result }}
        run: |
          set -u
          fail=0
          rot() { echo "::error::$1"; fail=1; }
          gruen() { echo "::notice::$1"; }

          [ "$PLAN" = "success" ] || rot "plan: $PLAN"
          case "$STATE" in
            PR|MAIN|MANUAL|UNKNOWN)
              [ "$GATES" = "success" ] || rot "gate: $GATES (Required-Set muss laufen, nicht skipped)"
              [ "$LIGHT" = "skipped" ] || rot "light: $LIGHT (nur im Zustand LIGHT)"
              ;;
            LIGHT)
              [ "$LIGHT" = "success" ] || rot "light: $LIGHT"
              [ "$GATES" = "skipped" ] || rot "gate: $GATES (kein Required-Set im Light-Zustand)"
              ;;
            NOOP)
              [ "$GATES" = "skipped" ] || rot "gate: $GATES (NOOP ohne Gates)"
              [ "$LIGHT" = "skipped" ] || rot "light: $LIGHT (NOOP ohne Gates)"
              [ "$NOOP" = "true" ] || rot "noop: $NOOP (Zustand NOOP ohne noop=true)"
              ;;
            *)
              rot "unbekannter Zustand '$STATE'"
              ;;
          esac

          case "$LONG" in success|skipped) gruen "long: $LONG" ;; *) rot "long: $LONG" ;; esac
          case "$CLAIMS" in success|skipped) gruen "claims: $CLAIMS" ;; *) rot "claims: $CLAIMS" ;; esac
          case "$COMMITMSG" in success|skipped) gruen "commitmsg: $COMMITMSG" ;; *) rot "commitmsg: $COMMITMSG" ;; esac

          # Die Kontrollebene darf nur dann identisch mit dem Pruefobjekt sein,
          # wenn der Plan den echten No-op bestaetigt.
          if [ "$INDEPENDENT" != "true" ] && [ "$NOOP" != "true" ]; then
            rot "Kontrollebene nicht unabhaengig (independent=$INDEPENDENT, noop=$NOOP)"
          fi
          exit "$fail"
