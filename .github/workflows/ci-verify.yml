name: CI Verify

# Ebene A des Main-Gates. "Fail-Closed Gates" ist der Pflichtstatus aus dem
# Branch-Schutz von `main`; er bleibt ein Aggregat, waehrend jedes Gate in der
# Matrix einen eigenen Status traegt. Ein roter Lauf nennt damit das Gate, das
# rot ist, statt "irgendetwas in verify:all".
#
# Zwei Geschwindigkeiten: ein Feature-Push bekommt das leichte Gate (schnelles
# Feedback, damit parallele Arbeit nicht wartet), PR gegen `main`, Push auf
# `main` und manuelle Laeufe bekommen das volle Profil - aufgeteilt auf
# unabhaengige Jobs, nicht als ein Monolith.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.profile.outputs.name }}
      matrix: ${{ steps.gates.outputs.matrix }}
      tests: ${{ steps.gates.outputs.test_files }}
      run: ${{ steps.dedupe.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Die Pruefsteuerung kommt aus der Basis, nicht aus dem geprueften PR:
      # sonst koennte der PR Planer, Gate-Auswahl und Claim-Pruefung selbst
      # umschreiben und einen gruenen Status ohne Pruefung erzeugen. Der
      # PR-Baum bleibt das Pruefobjekt (`RBD_ROOT`).
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          # Bootstrap: Eine Basis vor 0.3.164 kennt `RBD_ROOT` noch nicht und
          # wuerde die Gates im Kontroll-Checkout statt am PR-Baum fahren. Nur
          # fuer genau diesen Uebergangsfall laufen die PR-Skripte; danach
          # erkennt der Lauf die Basis und trennt Steuerung und Pruefobjekt.
          if grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
            echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Basis kennt RBD_ROOT noch nicht; Bootstrap mit den PR-Skripten."
            echo "scripts=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_OUTPUT"
            echo "control=" >> "$GITHUB_OUTPUT"
          fi
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      # Der Plan liest Testkatalog und Importgraph; beide brauchen `typescript`.
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Kein zweiter voller Lauf fuer denselben Commit: sobald ein PR offen ist,
      # ist der PR-Lauf die Wahrheit. Der Plan laeuft trotzdem weiter, damit die
      # Matrix gueltig bleibt und der Aggregat-Status erscheint.
      - name: Doppelten Lauf vermeiden
        id: dedupe
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$number existiert; der PR-Lauf prueft vollstaendig, dieser Push-Lauf endet hier."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Profil bestimmen
        id: profile
        run: |
          # Leicht fuer Feature-Pushes, voll fuer alles, was nach main will oder auf main liegt.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "name=all" >> "$GITHUB_OUTPUT"
            echo "::notice::Profil verify:all (PR, main oder manuell)"
          else
            echo "name=light" >> "$GITHUB_OUTPUT"
            echo "::notice::Profil verify:light (Feature-Push); voll prueft der PR gegen main"
          fi

      # Der Diff, den dieser Lauf wirklich prueft: PR Base gegen Head, Push
      # Before gegen Commit. Ohne belastbaren Bereich bleibt es beim vollen
      # Profil (siehe ci-plan.mjs); ein leerer Plan wird nie still gruen.
      - name: Basis und Kopf bestimmen
        id: range
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "impact=1" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "impact=1" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "impact=0" >> "$GITHUB_OUTPUT"
          fi

      # Eine Quelle fuer den Gate-Plan: derselbe `pipeline-plan` wie `verify`,
      # jetzt mit dem echten Diff als Eingabe. `pnpm audit` steht nur in der
      # Matrix, wenn sich Abhaengigkeiten wirklich geaendert haben.
      - name: Gate-Matrix aus Impact
        id: gates
        env:
          PROFILE: ${{ steps.profile.outputs.name }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: |
          node "${{ steps.control.outputs.scripts }}/ci-plan.mjs" \
            --base="${{ steps.range.outputs.base }}" \
            --head="${{ steps.range.outputs.head }}" \
            --profile="$PROFILE" \
            --impact="${{ steps.range.outputs.impact }}" \
            --github-output="$GITHUB_OUTPUT"

      # Eine leere oder kaputte Matrix wuerde als "Gate: failure" ohne Job
      # enden. Hier wird sie stattdessen mit ihrem Inhalt benannt.
      - name: Matrix validieren
        env:
          MATRIX: ${{ steps.gates.outputs.matrix }}
        run: |
          echo "::notice::Matrix-Laenge: ${#MATRIX}"
          node -e 'const raw = process.env.MATRIX ?? ""; let m; try { m = JSON.parse(raw); } catch (error) { console.error(`::error::Gate-Matrix ist kein JSON: ${error.message} :: ${raw}`); process.exit(1); } const inc = m.include; if (!Array.isArray(inc) || inc.length === 0) { console.error(`::error::Gate-Matrix ist leer: ${raw || "<leer>"}`); process.exit(1); } console.log(`Gates: ${inc.map((entry) => entry.gate).join(", ")}`);'

      # Klein und maschinenlesbar: welcher Diff, welche Gates, welche Tests,
      # was bewusst ausgelassen wurde. Kein Log-Friedhof, 7 Tage Retention.
      - name: CI-Plan-Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: .verify-cache/ci-plan.json
          if-no-files-found: ignore
          retention-days: 7

  # Ein Job je Gate. `fail-fast: false` laesst die anderen Gates fertig laufen:
  # ein roter Lint soll den Testnachweis nicht abschneiden.
  gate:
    name: Gate ${{ matrix.gate }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Grosszuegig: die CI ist die Werkstatt. Ein Abbruch oder Timeout ist
    # REMOTE_CI (Lauf wiederholen), kein roter Stand und kein BLOCKED.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Die Pruefsteuerung kommt aus der Basis, nicht aus dem geprueften PR:
      # sonst koennte der PR Planer, Gate-Auswahl und Claim-Pruefung selbst
      # umschreiben und einen gruenen Status ohne Pruefung erzeugen. Der
      # PR-Baum bleibt das Pruefobjekt (`RBD_ROOT`).
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          # Bootstrap: Eine Basis vor 0.3.164 kennt `RBD_ROOT` noch nicht und
          # wuerde die Gates im Kontroll-Checkout statt am PR-Baum fahren. Nur
          # fuer genau diesen Uebergangsfall laufen die PR-Skripte; danach
          # erkennt der Lauf die Basis und trennt Steuerung und Pruefobjekt.
          if grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
            echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Basis kennt RBD_ROOT noch nicht; Bootstrap mit den PR-Skripten."
            echo "scripts=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_OUTPUT"
            echo "control=" >> "$GITHUB_OUTPUT"
          fi
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      # Der Gate-Cache liegt ausserhalb von node_modules, weil pnpm install
      # --frozen-lockfile node_modules neu aufbaut. Innen entscheidet der
      # Inhalts-Hash des Arbeitsbaums, ob ein Gate wirklich gruen war.
      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v6
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ matrix.gate }}-${{ hashFiles('pnpm-lock.yaml', 'src/Config/eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-${{ matrix.gate }}-
            ${{ runner.os }}-rbd-verify-

      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          # Vollstaendige 22er-Linie, nicht der harte Minor: jsdom und eslint
          # verlangen einen aktuellen 22er-Stand, sonst stirbt der Vitest-Worker.
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Genau ein Gate, kein zweiter Lauf der ganzen Pipeline. Ist das Gate
      # nicht Teil des Profils, bricht der Schritt ab, statt still zu bestehen.
      # `RBD_TEST_FILES` kommt aus dem Impact-Plan; ohne Auswahl (volles
      # Profil, unklarer Diff) laeuft die Suite vollstaendig.
      - name: Gate ${{ matrix.gate }}
        env:
          RBD_TEST_FILES: ${{ needs.plan.outputs.tests }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: node "${{ steps.control.outputs.scripts }}/run-pipeline.mjs" --profile=${{ needs.plan.outputs.profile }} --gate=${{ matrix.gate }}

      - name: Gate-Protokoll bei Rot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-log-${{ matrix.gate }}
          path: .verify-cache/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Die Claim-Sperre greift auch dort, wo kein Hook laeuft: Cloud-Agenten und
  # GitHub-Codespaces haben `.githooks` nicht aktiv. Geprueft wird der PR-Diff
  # gegen die Basis, inklusive Meta-Sperre und Kollisionen.
  claims:
    name: Lane Claims
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Die Pruefsteuerung kommt aus der Basis, nicht aus dem geprueften PR:
      # sonst koennte der PR Planer, Gate-Auswahl und Claim-Pruefung selbst
      # umschreiben und einen gruenen Status ohne Pruefung erzeugen. Der
      # PR-Baum bleibt das Pruefobjekt (`RBD_ROOT`).
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          # Bootstrap: Eine Basis vor 0.3.164 kennt `RBD_ROOT` noch nicht und
          # wuerde die Gates im Kontroll-Checkout statt am PR-Baum fahren. Nur
          # fuer genau diesen Uebergangsfall laufen die PR-Skripte; danach
          # erkennt der Lauf die Basis und trennt Steuerung und Pruefobjekt.
          if grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
            echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Basis kennt RBD_ROOT noch nicht; Bootstrap mit den PR-Skripten."
            echo "scripts=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_OUTPUT"
            echo "control=" >> "$GITHUB_OUTPUT"
          fi
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Lane-Claims (Allowlist, Owner, Kollisionen)
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: node "${{ steps.control.outputs.scripts }}/verify-lane-claims.mjs" --ci

  commitmsg:
    name: Commit- und PR-Notes
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Die Pruefsteuerung kommt aus der Basis, nicht aus dem geprueften PR:
      # sonst koennte der PR Planer, Gate-Auswahl und Claim-Pruefung selbst
      # umschreiben und einen gruenen Status ohne Pruefung erzeugen. Der
      # PR-Baum bleibt das Pruefobjekt (`RBD_ROOT`).
      - name: Kontrollebene aus der Basis
        id: control
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          if [ "$base" = "$GITHUB_SHA" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Kontrollebene und Pruefobjekt sind derselbe Commit; keine unabhaengige Pruefung."
            exit 1
          fi
          dir=".rbd-control"
          rm -rf "$dir"
          git worktree add --detach "$dir" "$base"
          echo "::notice::Kontrollebene aus ${base}"
          echo "path=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          # Bootstrap: Eine Basis vor 0.3.164 kennt `RBD_ROOT` noch nicht und
          # wuerde die Gates im Kontroll-Checkout statt am PR-Baum fahren. Nur
          # fuer genau diesen Uebergangsfall laufen die PR-Skripte; danach
          # erkennt der Lauf die Basis und trennt Steuerung und Pruefobjekt.
          if grep -q "RBD_ROOT" "$dir/scripts/lib/report.mjs"; then
            echo "scripts=$GITHUB_WORKSPACE/$dir/scripts" >> "$GITHUB_OUTPUT"
            echo "control=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Basis kennt RBD_ROOT noch nicht; Bootstrap mit den PR-Skripten."
            echo "scripts=$GITHUB_WORKSPACE/scripts" >> "$GITHUB_OUTPUT"
            echo "control=" >> "$GITHUB_OUTPUT"
          fi
          echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Commit- und PR-Notes-Gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RBD_ROOT: ${{ steps.control.outputs.root }}
          RBD_CONTROL_ROOT: ${{ steps.control.outputs.control }}
        run: |
          # Beim Pull Request ist HEAD der automatische Merge-Commit, der keine
          # Notes traegt. Feature-Branches prueft `pr-escalation.yml`; hier wird
          # nur noch der Push auf main geprueft, damit kein Lauf doppelt prueft.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then node "${{ steps.control.outputs.scripts }}/verify-commit-msg.mjs" --head; fi
          if [ -n "$PR_BODY" ]; then node "${{ steps.control.outputs.scripts }}/verify-commit-msg.mjs" --pr; fi

  # Der Pflichtstatus bleibt genau einer. Er fuehrt nur Ergebnisse zusammen und
  # prueft selbst nichts; die Arbeit steht in den Gate-Jobs darueber.
  verify:
    name: Fail-Closed Gates
    needs: [plan, gate, claims, commitmsg]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Gate-Ergebnisse zusammenfuehren
        env:
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gate.result }}
          CLAIMS: ${{ needs.claims.result }}
          COMMITMSG: ${{ needs.commitmsg.result }}
        run: |
          fail=0
          for entry in "plan:$PLAN" "gate:$GATES" "claims:$CLAIMS" "commitmsg:$COMMITMSG"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            case "$result" in
              success|skipped) echo "::notice::$name: $result" ;;
              *) echo "::error::$name: $result"; fail=1 ;;
            esac
          done
          exit "$fail"
