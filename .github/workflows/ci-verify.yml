name: CI Verify

# Ein Branch pro Feature-Session, taskweise Commits/Pushes, PR erst am
# Feature-Ende. Dieser Workflow ist der einzige automatische CI-Trigger und
# laeuft ausschliesslich fuer Pull Requests gegen `main`.
#
# Der Job ist absichtlich EIN Job: dadurch gibt es genau einen geschuetzten
# Status, keine Matrix, keine doppelte Dependency-Installation und keinen
# zweiten Runner. Er traegt die schnellen Gates, den Web-Build, den
# Release-Versions-Bump fuer das PR-Artefakt und die Debug-APK.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fail-Closed Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Der PR-Body ist der Merge-Text. Er wird bei jedem Lauf frisch aus der
      # API gelesen, nicht aus dem Event-Payload.
      - name: PR-Body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
          PR_BODY="$body" node scripts/verify-pr-body.mjs

      - name: Commit-Notes
        run: node scripts/verify-commit-msg.mjs --head

      # Der Freeze-Checker kommt aus der Basis, das Pruefobjekt bleibt der
      # Kandidat. Damit kann ein PR die Regel nicht mit dem eigenen Skript
      # ausschalten. Der Kontroll-Worktree wird vor den Gates wieder entfernt.
      - name: Governance-Freeze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::Basis '${base}' ist kein Commit; ohne unabhaengige Kontrollebene keine Freigabe."
            exit 1
          fi
          rm -rf .rbd-control
          git worktree add --detach .rbd-control "$base"
          if [ ! -f .rbd-control/scripts/verify-governance-freeze.mjs ]; then
            echo "::notice::Kontrollebene kennt den Governance-Freeze nicht; Schritt inert."
            git worktree remove --force .rbd-control
            exit 0
          fi
          if RBD_ROOT="$PWD" node .rbd-control/scripts/verify-governance-freeze.mjs \
            --ci --base="$base" --head="$HEAD_SHA"; then
            git worktree remove --force .rbd-control
            exit 0
          fi
          git worktree remove --force .rbd-control || true
          exit 1

      # Der PR ist bereits lokal vorgeprueft. Die Cloud wiederholt nur die
      # schnellen Gates; die betroffenen Tests bleiben der lokale Nachweis.
      - name: Verify (Light)
        run: pnpm run verify:light

      # Artefakt-Version und APK gehoeren zum PR, nicht zu einem zweiten
      # Workflow. Der Versions-Bump wird nicht zurueckgepusht: der PR-Kopf
      # bleibt stabil, der Merge bumpet die Quelle weiterhin lokal.
      - name: Release-Version bump (Artefakt)
        run: node scripts/version-bump.mjs

      - name: Web-Build
        run: pnpm run build

      - name: Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: SDK-Plattform und Build-Tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Debug-APK bauen
        run: pnpm run android:apk

      - name: Debug-APK als PR-Artefakt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rigged-by-design-debug-apk-pr-${{ github.event.pull_request.number }}
          path: artifacts/rigged-by-design-debug.apk
          if-no-files-found: error
          retention-days: 7
