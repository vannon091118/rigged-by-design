name: CI Verify

# Ein erforderlicher Lauf pro PR. Feature-Pushes erzeugen/aktualisieren zuerst
# den PR; ein zweites Push-Gate und ein zweites Full-Gate auf main entfallen.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fail-Closed Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v6
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ hashFiles('pnpm-lock.yaml', 'src/Config/eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-

      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Impact aus dem zentralen Plan lesen
        id: impact
        run: node scripts/ci-impact.mjs --base=origin/${{ github.base_ref || 'main' }}

      - name: Lane-Claims und Branch-Owner pruefen
        if: github.head_ref != '' || github.ref_name != 'main'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: node scripts/verify-lane-claims.mjs --ci

      - name: PR-Body-Notes-Gate
        if: github.event_name == 'pull_request_target'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verify-commit-msg.mjs --pr

      - name: PR-Body-Notes-Gate fuer Dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: node scripts/verify-commit-msg.mjs --pr-branch

      - name: Betroffene schnelle Gates und Tests
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: pnpm run agent:verify -- --profile=quick

      - name: Production-Build fuer App-Aenderungen
        if: steps.impact.outputs.build == 'true'
        run: pnpm run build

      - name: Dependency-Audit fuer echte Dependency-Aenderungen
        if: steps.impact.outputs.audit == 'true'
        run: pnpm run audit:gate
