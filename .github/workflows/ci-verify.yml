name: CI Verify

# Ebene A des Main-Gates: jeder Push (auch auf `main`), jeder PR gegen `main`
# und jeder manuelle Lauf gehen durch dieselben Fail-Closed-Gates. Der
# Job-Name "Fail-Closed Gates" ist der Pflichtstatus, den das Ruleset aus
# docs/CI-GATES.md verlangt.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fail-Closed Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Der Gate-Cache liegt ausserhalb von node_modules, weil pnpm install --frozen-lockfile node_modules neu
      # aufbaut. Der aussere Key darf grob sein: innen entscheidet der Inhalts-Hash des
      # Arbeitsbaums, ob ein Gate wirklich gruen war.
      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ hashFiles('pnpm-lock.yaml', 'src/Config/eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v4
        with:
          # Vollstaendige 22er-Linie, nicht der harte Minor: jsdom und eslint
          # verlangen einen aktuellen 22er-Stand, sonst stirbt der Vitest-Worker.
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Commit- und PR-Notes-Gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Beim Pull Request ist HEAD der automatische Merge-Commit, der keine
          # Notes traegt. Feature-Branches prueft `pr-escalation.yml`; hier wird
          # nur noch der Push auf main geprueft, damit kein Lauf doppelt prueft.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then node scripts/verify-commit-msg.mjs --head; fi
          if [ -n "$PR_BODY" ]; then node scripts/verify-commit-msg.mjs --pr; fi

      # Rein lesend: der Lauf repariert nichts. Ein veralteter Baum wird rot.
      - name: Alle Fail-Closed-Gates
        env:
          RBD_VERIFY_AUDIT: '1'
        run: pnpm run verify:all
