name: CI Verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fail-Closed Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Der Gate-Cache liegt ausserhalb von node_modules, weil npm ci node_modules neu
      # aufbaut. Der aussere Key darf grob sein: innen entscheidet der Inhalts-Hash des
      # Arbeitsbaums, ob ein Gate wirklich gruen war.
      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-

      - name: Node 22 mit npm-Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Commit- und PR-Notes-Gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node scripts/verify-commit-msg.mjs --head
          if [ -n "$PR_BODY" ]; then node scripts/verify-commit-msg.mjs --pr; fi

      - name: Autofix + alle Fail-Closed-Gates
        env:
          RBD_VERIFY_AUDIT: '1'
        run: npm run verify:all
