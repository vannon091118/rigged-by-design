name: CI Verify

# Local-first: GitHub Actions ist nicht mehr die primaere Build- und
# Testumgebung. Dieser Workflow traegt genau einen schnellen Pflichtstatus.
# Die vollstaendigen Integration-Gates laufen lokal ueber
# `pnpm run verify:integration`; Langlaeufe nur ueber `pnpm run verify:long`.
#
# Bewusst nicht enthalten: Matrix, Push-Lauf auf `main`, lange Nachweise,
# APK-Build, Release-Trigger und doppelte Dependency-Installationen. Der
# Pflichtstatus `Fail-Closed Gates` bleibt der einzige geschuetzte Status.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      profile:
        description: 'light = schneller Pflichtcheck; integration = lokaler Vollnachweis in der Cloud'
        required: true
        type: choice
        options: [light, integration]
        default: light

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fail-Closed Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Der PR-Body ist der Merge-Text. Er wird bei jedem Lauf frisch aus der
      # API gelesen, nicht aus dem Event-Payload.
      - name: PR-Body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
          PR_BODY="$body" node scripts/verify-pr-body.mjs

      - name: Commit-Notes
        run: node scripts/verify-commit-msg.mjs --head

      # Der Freeze-Checker kommt aus der Basis, das Pruefobjekt bleibt der
      # Kandidat. Damit kann ein PR die Regel nicht mit dem eigenen Skript
      # ausschalten. Der Kontroll-Worktree wird vor den Gates wieder entfernt.
      - name: Governance-Freeze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::Basis '${base}' ist kein Commit; ohne unabhaengige Kontrollebene keine Freigabe."
            exit 1
          fi
          rm -rf .rbd-control
          git worktree add --detach .rbd-control "$base"
          if [ ! -f .rbd-control/scripts/verify-governance-freeze.mjs ]; then
            echo "::notice::Kontrollebene kennt den Governance-Freeze nicht; Schritt inert."
            git worktree remove --force .rbd-control
            exit 0
          fi
          if RBD_ROOT="$PWD" node .rbd-control/scripts/verify-governance-freeze.mjs \
            --ci --base="$base" --head="$HEAD_SHA"; then
            git worktree remove --force .rbd-control
            exit 0
          fi
          git worktree remove --force .rbd-control || true
          exit 1

      # Lokal-first: PR und Standard-Dispatch fahren nur die schnellen Gates.
      # Der manuelle Dispatch kann den vollen lokalen Integrationsnachweis
      # ausdruecklich in der Cloud wiederholen; er ist kein PR-Pflichtstatus.
      - name: Verify
        env:
          PROFILE: ${{ inputs.profile || 'light' }}
        run: pnpm run "verify:${PROFILE}"
