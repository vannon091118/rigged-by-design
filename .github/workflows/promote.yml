name: Promote

# Ein Lauf pro CI-Ergebnis. Gruen heisst: der PR gegen `main` ist bereit und
# wird gemergt. Rot heisst: Issue und Label, aber kein automatischer Dump auf
# `integration` - die bleibt der letzte Notausgang und laeuft nur auf
# ausdrueckliche Anforderung (`integrate=true`).
on:
  workflow_run:
    workflows: ["CI Verify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      integrate:
        description: 'Rote Staende wirklich auf die Integrationsbranch legen (Notausgang)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Gruen mergen, rot als Issue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Identitaet auf den Eigentuemer setzen
        run: |
          git config user.name "Vannon"
          git config user.email "Schneider.felix1993@gmail.com"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          INTEGRATE: ${{ inputs.integrate && '1' || '0' }}
        run: node scripts/promote.mjs
