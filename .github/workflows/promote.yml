name: Promote

# Ein Lauf pro CI-Ergebnis. Gruen heisst: der PR gegen `main` ist bereit und
# wird gemergt. Rot heisst: Issue und Label, aber kein automatischer Dump auf
# `integration` - die bleibt der letzte Notausgang und laeuft nur auf
# ausdrueckliche Anforderung (`integrate=true`).
on:
  workflow_run:
    workflows: ["CI Verify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = Status anzeigen; integrate = rote Staende auf integration (Notausgang)'
        type: choice
        options: [inspect, integrate]
        default: inspect
      pr:
        description: 'PR-Nummer fuer die Anzeige (optional)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Gruen mergen, rot als Issue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Schreibrechte und fremder Code gehoeren nicht zusammen. Dieser Lauf
      # prueft nichts, er merged; deshalb wird ausschliesslich `main`
      # ausgecheckt. Den geprueften Kopf holt `fetchHead()` in promote.mjs als
      # Ref (nur fuer Titel und Merge-Text) - ausgefuehrt wird er nie.
      - name: Checkout (vertrauenswuerdiges main)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Identitaet auf den Eigentuemer setzen
        run: |
          git config user.name "Vannon"
          git config user.email "Schneider.felix1993@gmail.com"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || '' }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          EVENT: ${{ github.event.workflow_run.event || '' }}
          MODE: ${{ inputs.mode || '' }}
          INTEGRATE: ${{ inputs.mode == 'integrate' && '1' || '0' }}
        run: node scripts/promote.mjs
