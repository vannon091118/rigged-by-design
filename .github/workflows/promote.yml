name: Promote

# Kein Auto-Merge mehr. Der Merge nach `main` ist ein bewusster manueller
# Schritt nach `pnpm run verify:integration`; `promote` zeigt den PR-Status
# oder legt auf ausdrueckliche Anforderung den Notausgang `integration` an.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = Status anzeigen; integrate = roten Stand auf integration (Notausgang)'
        type: choice
        options: [inspect, integrate]
        default: inspect
      pr:
        description: 'PR-Nummer fuer die Anzeige (optional)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Status anzeigen oder Notausgang
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Schreibrechte und fremder Code gehoeren nicht zusammen. Dieser Lauf
      # prueft nichts, er zeigt oder integriert; deshalb wird ausschliesslich
      # `main` ausgecheckt.
      - name: Checkout (vertrauenswuerdiges main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Identitaet auf den Eigentuemer setzen
        run: |
          git config user.name "Vannon"
          git config user.email "Schneider.felix1993@gmail.com"

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          PR_NUMBER: ${{ inputs.pr || '' }}
          MODE: ${{ inputs.mode || 'inspect' }}
          INTEGRATE: ${{ inputs.mode == 'integrate' && '1' || '0' }}
        run: node scripts/promote.mjs
