name: Render inventory sync
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/render/r1-r12-rework
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-inventory.mjs
      - run: |
          git config user.name 'render-sync'
          git config user.email 'render-sync@users.noreply.github.com'
          git rm -q .github/workflows/render-inventory-sync.yml || true
          git add docs/INVENTORY.md
          git diff --cached --quiet || git commit -m 'docs: Inventur nach Render-Merge regenerieren'
          git push origin HEAD:lane/render/r1-r12-rework
