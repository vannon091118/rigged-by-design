name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (leer = aktueller Branch, kein Release-Upload)'
        required: false
  # Der Release-Workflow ruft diesen Build direkt auf: ein mit GITHUB_TOKEN
  # gepushter Tag loest keinen eigenen Workflow aus.
  workflow_call:
    inputs:
      tag:
        description: 'Release-Tag, den der Aufrufer gebaut haben will'
        required: true
        type: string
      skip_verify:
        description: 'Aufrufer hat den Commit bereits durch CI Verify geprueft'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: apk-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Capacitor APKs (Debug + Release)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-

      - name: Node 22 mit npm-Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Kein cache: gradle – das Android-Projekt existiert erst nach cap add,
          # der Cache-Schlüssel-Suchlauf würde den Job sonst rot machen.

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Der Action-Default nennt auch `tools`; Google liefert das Paket nicht
          # mehr aus und sdkmanager bricht den Job ab. cmdline-tools und Lizenzen
          # sind damit trotzdem eingerichtet.
          packages: platform-tools

      - name: SDK-Plattform und Build-Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install (npm ci)
        run: npm ci

      # Der Release ruft diesen Workflow erst nach erfolgreichem "CI Verify"
      # auf und setzt skip_verify; eine zweite vollstaendige Suite waere reine
      # Doppelarbeit. Manuelle Builds und manuell gepushte Tags pruefen weiterhin
      # selbst, weil dort skip_verify fehlt beziehungsweise false ist.
      - name: Fail-Closed-Gates
        if: ${{ !inputs.skip_verify }}
        run: npm run verify:release

      - name: Gradle assembleDebug (signierbare Debug-APK)
        run: npm run android:apk

      - name: Gradle assembleRelease (Release-APK ohne Signatur)
        run: npm run android:apk:release

      - name: Debug-APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: rigged-by-design-debug-apk
          path: artifacts/rigged-by-design-debug.apk
          if-no-files-found: error

      - name: Release-APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: rigged-by-design-release-unsigned-apk
          path: artifacts/rigged-by-design-release-unsigned.apk
          if-no-files-found: error

      - name: Release-Tag bestimmen
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: APK als Release-Asset
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Automatisch gebaute APKs: Debug installierbar, Release ohne Signatur."
          gh release upload "$TAG" artifacts/rigged-by-design-debug.apk artifacts/rigged-by-design-release-unsigned.apk --clobber

      - name: Artefakte am Release pruefen
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets" | grep -qx 'rigged-by-design-debug.apk' \
            || { echo "::error::Release $TAG enthaelt kein APK-Artefakt"; exit 1; }
          echo "$assets" | grep -qx 'rigged-by-design-release-unsigned.apk' \
            || { echo "::error::Release $TAG enthaelt keine Release-APK"; exit 1; }
