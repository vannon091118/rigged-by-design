name: PR Escalation

# Der Commit-Body ist kein Fail-Closed-Gate mehr: fehlt die Pflichtstruktur,
# ergaenzt dieser Workflow sie in einem abgegrenzten Automationsbereich.
#
# Schreibrechte und fremder Code gehoeren nicht zusammen. Der Workflow checkt
# deshalb ausschliesslich `main` aus; der Push-Branch kommt als Ref dazu und
# liefert nur Diff und Commit-Text. Vorher lief hier Code aus dem gepushten
# Branch mit `pull-requests: write` - dieselbe Luecke, die `promote` schon
# geschlossen hat.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-escalation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lift:
    name: Diff in den PR-Body heben
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (vertrauenswuerdiges main)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Branch-Kopf als Daten holen
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: git fetch --no-tags origin "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
      - name: PR-Body abgleichen
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/lift-commit-body.mjs
