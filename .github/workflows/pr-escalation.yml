name: PR Escalation

# Privilegierter PR-Schreiber: nur per Dispatch aus einem vertrauenswuerdigen
# Workflow starten und immer den Code aus main ausfuehren.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Arbeitsbranch nach erfolgreichem Push
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: pr-escalation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lift:
    name: Commit-Body in PR-Body heben
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Vertrauenswuerdigen Helfer aus main auschecken
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: PR anlegen oder Body aktualisieren
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || github.token }}
          BRANCH: ${{ inputs.branch }}
          RBD_DISPATCH_CI: ${{ secrets.PROMOTE_TOKEN == '' && '1' || '0' }}
        run: node scripts/lift-commit-body.mjs
