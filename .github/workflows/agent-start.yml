name: Agent Start

# Beweislauf fuer den einen Einstieg. Er liest das Board live mit dem
# automatisch injizierten `secrets.GITHUB_TOKEN` und fuehrt **keine** Tests,
# Gates, Builds oder APKs aus — die Linie bleibt lokal (`docs/CI.md`).
#
# Damit ist belegt, dass `pnpm run agent:start --brief` in einer frischen
# Umgebung ohne jeden Nutzer-Eingriff gruen laeuft: kein PAT, kein Secret im
# Repo, keine Zustandsdatei.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-start-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    name: Board, Claims und Mechanik-Inventur lesen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: pnpm bereitstellen
        run: corepack enable pnpm

      - name: agent:start --brief gegen das echte Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RBD_REPO: ${{ github.repository }}
        run: pnpm run agent:start --brief | tee "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Ereignis-Hook ausloesen
    needs: board
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: repository_dispatch(board-refresh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RBD_REPO: ${{ github.repository }}
        run: node scripts/agent-start.mjs --dispatch --brief

      - name: Letzte Laeufe des Ereignis-Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run list --workflow=board-overview.yml --limit=3
