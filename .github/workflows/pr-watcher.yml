name: PR Watcher

# Überwacht PRs und CI-Flows. Ein roter Lauf erzeugt ein Issue mit allen Infos;
# ein Timeout oder Abbruch ist REMOTE_CI (Issue mit Label `remote-ci`, kein
# Blocker). Ist `main` gruen, werden erledigte gate-failure-Issues geschlossen.
on:
  workflow_run:
    workflows: ["CI Verify", "Long Checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sweep_green:
        description: Issues schliessen, deren Commit nachweislich auf main liegt
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  # Bei workflow_run ist github.ref der Default-Branch: mit einer gemeinsamen
  # Gruppe wuerden sich Watcher-Laeufe gegenseitig abbrechen. Der Run ist die Identitaet.
  group: pr-watcher-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    name: PR + CI überwachen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Issue bei rotem Gate oder Timeout erstellen
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: node scripts/pr-watcher.mjs

      - name: Issues schliessen, wenn main gruen ist
        if: >-
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'main') ||
          (github.event_name == 'workflow_dispatch' && inputs.sweep_green)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/pr-watcher.mjs --sweep-green
