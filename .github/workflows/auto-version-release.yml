name: Auto Version & Release

# CLOUD / MANUAL: Ein Release ist ein bewusster Vorgang, kein Nebeneffekt
# eines Pushes. Der Lauf prueft lokal dieselben Release-Gates und taggt erst
# danach. Die APK entsteht standardmaessig lokal; der manuelle Cloud-Fallback
# liegt in `build-apk.yml`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag und Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Erst wenn alle Release-Gates lokal/identisch gruen sind, entsteht ein
      # Tag. Kein APK-Build in diesem Workflow.
      - name: Release-Gates
        run: pnpm run verify:release

      - name: Commit-Text des geprueften Commits
        run: node scripts/verify-commit-msg.mjs --head

      - name: Tag und Release erstellen (kein Commit, main bleibt stehen)
        id: tag
        env:
          # gh liest GH_TOKEN; ci-tag-release.mjs waehlt die Eskalationsstufe
          # ueber GITHUB_TOKEN. Beide muessen gesetzt sein.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci-tag-release.mjs --github-output "$GITHUB_OUTPUT"
