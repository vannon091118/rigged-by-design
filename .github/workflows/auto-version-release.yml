name: Auto Version & Release

# Ebene A: kein Nachrichtenmuster schaltet die Pruefung ab. Der Job laeuft bei
# jedem Push auf `main`; `verify:release` ist rein lesend und laeuft vor jedem
# Tag. `[skip ci]` wird von GitHub selbst ausgewertet (dann startet gar kein
# Workflow) - diesen Skip schliesst erst Ebene B, das Main-Ruleset in
# docs/CI-GATES.md, weil dort der fehlende Pflichtstatus den Merge blockiert.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-

      - name: Node 22 mit npm-Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Alle Gates vor Release
        run: npm run verify:release

      - name: Tag und Release erstellen (kein Commit, main bleibt stehen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-tag-release.mjs
