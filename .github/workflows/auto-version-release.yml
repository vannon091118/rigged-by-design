name: Auto Version & Release

# Ebene A: kein Nachrichtenmuster schaltet die Pruefung ab. Der Release startet
# erst nach einem erfolgreichen Lauf von "CI Verify" fuer denselben main-Commit;
# die vollstaendige Suite laeuft damit genau einmal. Dieser Workflow taggt nur
# noch. `[skip ci]` wird von GitHub selbst ausgewertet (dann startet gar kein
# Workflow) - diesen Skip schliesst erst Ebene B, das Main-Ruleset in
# docs/CI-GATES.md, weil dort der fehlende Pflichtstatus den Merge blockiert.
on:
  workflow_run:
    workflows: ["CI Verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, release
    # Nur der erfolgreiche Push-Lauf von CI Verify auf main darf taggen. Ein
    # manueller Dispatch prueft weiterhin selbst, weil er keinen CI-Lauf hat.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node 22 mit npm-Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Nur der manuelle Pfad hat keinen vorgelagerten CI-Lauf. Der
      # automatische Pfad taggt ausschliesslich den bereits geprueften Commit.
      - name: Install (npm ci, nur manuell)
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Alle Gates vor manuellem Release
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify:release

      # Eskalationsleiter: GITHUB_TOKEN -> RELEASE_TOKEN (falls hinterlegt) ->
      # sichtbarer Block mit Anleitung. Ein Tag, der schon existiert, erzeugt
      # kein zweites Release.
      # Der Merge kam ohne Push-Ereignis (GITHUB_TOKEN): dieses Gate prueft den
      # Merge-Commit, bevor ein Tag entsteht.
      - name: Commit-Text des geprueften Commits
        run: node scripts/verify-commit-msg.mjs --head

      - name: Tag und Release erstellen (kein Commit, main bleibt stehen)
        id: tag
        env:
          # gh liest GH_TOKEN; ci-tag-release.mjs waehlt die Eskalationsstufe
          # ueber GITHUB_TOKEN. Beide muessen gesetzt sein, sonst sieht das
          # Skript den Workflow-Token nicht und blockiert trotz Schreibrecht.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # workflow_run setzt GITHUB_SHA auf den Default-Branch. Der Tag muss
          # aber genau den geprueften Commit treffen; RELEASE_SHA hat Vorrang.
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci-tag-release.mjs --github-output "$GITHUB_OUTPUT"

  # Der Tag wird mit GITHUB_TOKEN gepusht; dessen Events starten keine
  # Workflows. Deshalb ruft der Release den APK-Build explizit auf, statt auf
  # den Tag-Trigger zu hoffen.
  apk:
    name: APK aus dem Release bauen
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build-apk.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      skip_verify: true
    secrets: inherit
