name: Auto Version & Release

# Ebene A: PR-Promotion prueft den exakten Head und uebergibt die Merge-SHA.
# Der Release-Workflow taggt den geprueften Main-Stand und wiederholt die Suite
# nicht. Ein manueller Lauf ohne Pruefbeleg fuehrt weiterhin verify:release aus.
# APK und Release-Assets entstehen nur, wenn der Commit Code, Inhalte oder
# Assets beruehrt - bei reiner Doku bleibt der Lauf beim Tag.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Squash-Commit aus der geprueften PR-Promotion
        type: string
        required: false
      verified_head:
        description: PR-Head mit erfolgreichem Pflicht-Gate
        type: string
        required: false

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, release
    # Nur der erfolgreiche Push-Lauf von CI Verify auf main darf taggen. Ein
    # manueller Dispatch prueft weiterhin selbst, weil er keinen CI-Lauf hat.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      apk: ${{ steps.relevance.outputs.build }}
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.verified_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Alle Gates vor manuellem Release
        if: github.event_name == 'workflow_dispatch' && inputs.verified_sha == ''
        run: pnpm run verify:release

      - name: Gepruefte Promotion-SHAs bestaetigen
        if: github.event_name == 'workflow_dispatch' && inputs.verified_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.verified_sha }}
          VERIFIED_HEAD: ${{ inputs.verified_head }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${VERIFIED_HEAD}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Fail-Closed Gates" and .status == "completed")][ -1 ].conclusion' \
            | grep -qx success

      # APK nur bei relevanter Aenderung: reine Doku, Governance-Texte und
      # Marker brauchen keinen Android-Bau.
      - name: Relevanz fuer APK bestimmen
        id: relevance
        run: |
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -z "$prev" ]; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
            echo "::notice::kein Vorgaenger-Tag; APK wird gebaut"
          else
            node scripts/ci-impact.mjs --base="$prev"
          fi

      # Eskalationsleiter: GITHUB_TOKEN -> RELEASE_TOKEN (falls hinterlegt) ->
      # sichtbarer Block mit Anleitung. Ein Tag, der schon existiert, erzeugt
      # kein zweites Release.
      # Der Merge kam ohne Push-Ereignis (GITHUB_TOKEN): dieses Gate prueft den
      # Merge-Commit, bevor ein Tag entsteht.
      - name: Commit-Text des geprueften Commits
        run: node scripts/verify-commit-msg.mjs --head

      - name: Tag und Release erstellen (kein Commit, main bleibt stehen)
        id: tag
        env:
          # gh liest GH_TOKEN; ci-tag-release.mjs waehlt die Eskalationsstufe
          # ueber GITHUB_TOKEN. Beide muessen gesetzt sein, sonst sieht das
          # Skript den Workflow-Token nicht und blockiert trotz Schreibrecht.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # workflow_run setzt GITHUB_SHA auf den Default-Branch. Der Tag muss
          # aber genau den geprueften Commit treffen; RELEASE_SHA hat Vorrang.
          RELEASE_SHA: ${{ inputs.verified_sha || github.sha }}
        run: node scripts/ci-tag-release.mjs --github-output "$GITHUB_OUTPUT"

  # Der Tag wird mit GITHUB_TOKEN gepusht; dessen Events starten keine
  # Workflows. Deshalb ruft der Release den APK-Build explizit auf, statt auf
  # den Tag-Trigger zu hoffen.
  apk:
    name: APK aus dem Release bauen
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.apk == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-apk.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      skip_verify: true
    secrets: inherit
