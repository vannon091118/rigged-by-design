name: Auto Version & Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, release
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .verify-cache
          key: ${{ runner.os }}-rbd-verify-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            ${{ runner.os }}-rbd-verify-

      - name: Node 22 mit npm-Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Alle Gates vor Release
        run: npm run verify:release

      - name: Tag und Release erstellen (kein Commit, main bleibt stehen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-tag-release.mjs
