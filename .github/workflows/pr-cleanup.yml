name: PR Cleanup

# Gemergte Wegwerf-Branches werden geloescht. Das ist die eine sichtbare
# Aufraeumaktion nach dem Merge; `main`, `integration`, `integration/*` und
# Branches mit dem Label `keep-branch` bleiben unangetastet. Der Workflow
# laeuft nur fuer Branches aus diesem Repository, nie fuer Fork-Branches.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Gemergten Head-Branch loeschen
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'integration' &&
      !startsWith(github.event.pull_request.head.ref, 'integration/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'keep-branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Branch loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::notice::PR #${NUMBER} ist gemergt; Branch '${BRANCH}' wurde geloescht."
            {
              echo "### Aufgeraeumt: \\`${BRANCH}\\`"
              echo ""
              echo "PR #${NUMBER} ist gemergt. Der Head-Branch wurde geloescht."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Branch '${BRANCH}' konnte nicht geloescht werden; bereits entfernt, geschuetzt oder fehlende Berechtigung."
            {
              echo "### Nicht geloescht: \\`${BRANCH}\\`"
              echo ""
              echo "PR #${NUMBER} ist gemergt, aber der Branch konnte nicht entfernt werden."
              echo "Pruefe, ob er bereits geloescht, geschuetzt oder das Label \\`keep-branch\\` gesetzt ist."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
