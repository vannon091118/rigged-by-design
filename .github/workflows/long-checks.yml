name: Long Checks

# Lange Nachweise laufen nicht in der lokalen Schleife: RTP-Statistik, Poker-
# Verteilung, Soak und Balance brauchen Minuten bis Stunden. `pnpm run ci:long`
# startet diesen Workflow und liest Ergebnis, Logs und Artefakte von hier.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      verify:
        description: 'Vollstaendige Fail-Closed-Gates zusaetzlich mitlaufen lassen'
        type: boolean
        # Der PR-Lauf prueft bereits; ein zweites verify:all hier waere Doppelarbeit.
        default: false
      soak_ticks:
        description: 'Ticks fuer den Soak-Lauf'
        type: string
        default: '100000'
      balance_days:
        description: 'Spieltage fuer den Balance-Lauf'
        type: string
        default: '40'
      advisory:
        description: 'Nur betroffene lange Nachweise ausfuehren'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: long-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advisory:
    name: Betroffene lange Tests (Advisory)
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Nur betroffene lange Nachweise ausfuehren
        run: pnpm run test:ci -- --affected-long

  verify:
    name: Fail-Closed Gates
    if: github.event_name == 'workflow_dispatch' && inputs.verify && !inputs.advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Alle Fail-Closed-Gates
        env:
          RBD_VERIFY_AUDIT: '1'
        run: pnpm run verify:all

  statistics:
    name: Statistik (RTP und Kartenverteilung)
    if: github.event_name == 'workflow_dispatch' && !inputs.advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      # Die Beweisklasse kommt aus dem zentralen Testkatalog.
      - name: Statistik-Nachweise
        run: pnpm run test:ci -- --proof=statistics

  soak:
    name: Soak ${{ inputs.soak_ticks }} Ticks
    if: github.event_name == 'workflow_dispatch' && !inputs.advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Langlauf
        env:
          RBD_SOAK: '1'
          RBD_SOAK_TICKS: ${{ inputs.soak_ticks }}
        run: pnpm exec vitest run --config src/Config/vite.config.ts src/core/sim/__tests__/soak.test.ts

  narrative-longrun:
    name: Narrative Longrun
    if: github.event_name == 'workflow_dispatch' && !inputs.advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Narrative Langlauf
        env:
          RBD_NARRATIVE_LONGRUN: '1'
        run: pnpm exec vitest run --config src/Config/vite.config.ts src/core/sim/__tests__/narrative-longrun.test.ts

  balance:
    name: Balance ${{ inputs.balance_days }} Spieltage
    if: github.event_name == 'workflow_dispatch' && !inputs.advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Betriebslauf
        run: node scripts/balance-run.mjs --days=${{ inputs.balance_days }}
      # Der Bericht ist der eigentliche Nachweis; er gehoert zum Lauf, nicht ins Log.
      - name: Balance-Bericht als Artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: balance-report
          path: artifacts/
          if-no-files-found: warn

  bench:
    name: Benchmarks
    if: github.event_name == 'workflow_dispatch' && !inputs.advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm installieren
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Messlaeufe
        run: pnpm run test:perf
