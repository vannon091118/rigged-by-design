name: Long Checks

# Lange Nachweise laufen nicht in der lokalen Schleife: RTP-Statistik, Poker-
# Verteilung, Soak und Balance brauchen Minuten bis Stunden. `pnpm run ci:long`
# startet diesen Workflow und liest Ergebnis, Logs und Artefakte von hier.
on:
  workflow_dispatch:
    inputs:
      verify:
        description: 'Vollstaendige Fail-Closed-Gates zusaetzlich mitlaufen lassen'
        type: boolean
        # Der PR-Lauf prueft bereits; ein zweites verify:all hier waere Doppelarbeit.
        default: false
      soak_ticks:
        description: 'Ticks fuer den Soak-Lauf'
        type: string
        default: '100000'
      balance_days:
        description: 'Spieltage fuer den Balance-Lauf'
        type: string
        default: '40'

permissions:
  contents: read

concurrency:
  group: long-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Fail-Closed Gates
    if: inputs.verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Alle Fail-Closed-Gates
        env:
          RBD_VERIFY_AUDIT: '1'
        run: pnpm run verify:all

  statistics:
    name: Statistik (RTP und Kartenverteilung)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      # Diese Suiten sind Beweisklasse "statistics"; lokal laufen sie nie.
      - name: Monte-Carlo-Nachweise
        run: >-
          pnpm exec vitest run --config src/Config/vite.config.ts
          src/core/games/__tests__/round-rtp-high.test.ts
          src/core/games/__tests__/round-rtp-machines.test.ts
          src/core/games/__tests__/slot-session-rtp.test.ts
          src/core/games/__tests__/poker-distribution.test.ts

  soak:
    name: Soak ${{ inputs.soak_ticks }} Ticks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Langlauf
        env:
          RBD_SOAK: '1'
          RBD_SOAK_TICKS: ${{ inputs.soak_ticks }}
        run: pnpm exec vitest run --config src/Config/vite.config.ts src/core/sim/__tests__/soak.test.ts

  narrative-longrun:
    name: Narrative Longrun
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1
      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Narrative Langlauf
        env:
          RBD_NARRATIVE_LONGRUN: '1'
        run: pnpm exec vitest run --config src/Config/vite.config.ts src/core/sim/__tests__/narrative-longrun.test.ts

  balance:
    name: Balance ${{ inputs.balance_days }} Spieltage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Betriebslauf
        env:
          RBD_DAYS: ${{ inputs.balance_days }}
        run: node scripts/balance-run.mjs
      # Der Bericht ist der eigentliche Nachweis; er gehoert zum Lauf, nicht ins Log.
      - name: Balance-Bericht als Artefakt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: balance-report
          path: artifacts/
          if-no-files-found: warn

  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: pnpm installieren
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.4.1

      - name: Node 22 mit pnpm-Cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Messlaeufe
        run: pnpm run test:perf
