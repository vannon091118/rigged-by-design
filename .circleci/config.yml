version: 2.1

# =============================================================================
# CircleCI ersetzt die GitHub-Workflows. Local-first bleibt die Regel:
#   - jeder Push        -> guard        (Sekunden, ohne pnpm install)
#   - main              -> integration  (verify:fast: Light + Testqualitaet
#                                        + betroffene Tests + Build)
#   - Tag v*            -> release-gates (verify:release) -> apk -> publish
#   - woechentlich      -> long          (verify:long: Soak, Balance, Bench)
#   - manuell           -> Pipeline-Parameter run_apk / run_long
#
# Budget: 30.000 Credits/Monat = 6.000 Minuten Docker small (5 Credits/Min).
# Bei 100 Commits/Tag (~3.000/Monat) kostet guard ~45 s = ~3,75 Credits,
# also ~11.250 Credits. integration (main) ~1.200, Releases ~5.250,
# long (4x/Monat) ~1.600 -> Summe ~19.300, Reserve ~10.700 Credits.
# Voraussetzung: im Projekt "Auto-cancel redundant workflows" aktivieren,
# sonst kosten superseded Pushes zusaetzlich.
# =============================================================================

parameters:
  run_apk:
    type: boolean
    default: false
  run_long:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:22.22
    resource_class: small
  android:
    docker:
      - image: cimg/android:2026.10
    resource_class: medium

commands:
  node22:
    description: Node 22 ueber nvm bereitstellen (Android-Image bringt es nicht mit)
    steps:
      - run:
          name: Node 22 und pnpm
          command: |
            set -euo pipefail
            source /opt/circleci/.nvm/nvm.sh
            nvm install 22
            nvm alias default 22
            echo 'source /opt/circleci/.nvm/nvm.sh && nvm use default >/dev/null' >> "$BASH_ENV"
            node --version
            sudo corepack enable
            corepack prepare pnpm@10.4.1 --activate
            pnpm --version

  install:
    description: pnpm aus dem Lockfile, mit Store-Cache
    steps:
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: pnpm aktivieren
          command: |
            set -euo pipefail
            sudo corepack enable
            corepack prepare pnpm@10.4.1 --activate
            pnpm --version
      - run:
          name: Install (frozen lockfile)
          command: pnpm install --frozen-lockfile --prefer-offline
          no_output_timeout: 10m
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
            - ~/.cache/pnpm

jobs:
  guard:
    executor: node
    steps:
      - checkout
      - run:
          name: Commit-Konvention
          command: node scripts/verify-commit-msg.mjs --head
      - run:
          name: PR fuer Lane sicherstellen
          command: |
            set -euo pipefail
            case "${CIRCLE_BRANCH:-}" in
              lane/*) ;;
              *) echo "Kein Lane-Branch; PR-Sync uebersprungen."; exit 0 ;;
            esac
            node .circleci/ensure-pr.mjs

  integration:
    executor: node
    steps:
      - checkout
      - install
      # Der lokale Standard vor dem Push; die volle Suite bleibt dem Release.
      - run:
          name: verify:fast
          command: pnpm run verify:fast
          no_output_timeout: 30m
      - store_artifacts:
          path: .verify-cache/reports
          destination: gate-reports

  release-gates:
    executor: node
    steps:
      - checkout
      - install
      - run:
          name: Tag und package.json muessen uebereinstimmen
          command: |
            set -euo pipefail
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const pkg = JSON.parse(readFileSync("package.json", "utf8"));
              const tag = (process.env.CIRCLE_TAG ?? "").replace(/^v/, "");
              if (!tag) { console.error("CIRCLE_TAG fehlt"); process.exit(1); }
              if (tag !== pkg.version) {
                console.error(`Tag ${tag} passt nicht zu package.json ${pkg.version}`);
                process.exit(1);
              }
              console.log(`Release ${tag} bestaetigt`);
            '
      - run:
          name: verify:release (15 Required-Gates + Audit)
          command: pnpm run verify:release
          no_output_timeout: 45m
      - persist_to_workspace:
          root: .
          paths:
            - dist
      - store_artifacts:
          path: .verify-cache/reports
          destination: gate-reports

  apk:
    executor: android
    steps:
      - checkout
      - node22
      - install
      - attach_workspace:
          at: .
      - run:
          name: Debug-APK (versionierter Debug-Schluessel)
          command: pnpm run android:apk
          no_output_timeout: 20m
      - run:
          name: Release-APK nur mit Produktionssignatur
          command: |
            set -euo pipefail
            if [ -n "${RBD_ANDROID_KEYSTORE_BASE64:-}" ]; then
              pnpm run android:apk:release
            else
              echo "Keine Produktionssignatur hinterlegt; es entsteht keine Release-APK."
            fi
          no_output_timeout: 20m
      - store_artifacts:
          path: artifacts
          destination: apk
      - run:
          name: APK am GitHub-Release veroeffentlichen und pruefen
          command: node .circleci/publish-apk.mjs

  long:
    executor: node
    steps:
      - checkout
      - install
      - run:
          name: verify:long
          command: pnpm run verify:long
          no_output_timeout: 90m

workflows:
  push-guard:
    jobs:
      - guard:
          # GH_TOKEN aus dem Context; fehlt er, legt der Push keinen PR an (kein stiller Erfolg).
          context: rbd-cloud
          filters:
            branches:
              ignore: [main]
            tags:
              ignore: /.*/

  main-integration:
    jobs:
      - integration:
          filters:
            branches:
              only: [main]

  release:
    jobs:
      - release-gates:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - apk:
          requires: [release-gates]
          context: rbd-cloud
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/

  long-checks:
    triggers:
      - schedule:
          cron: "0 3 * * 1"
          filters:
            branches:
              only: [main]
    jobs:
      - long

  manual-apk:
    when: << pipeline.parameters.run_apk >>
    jobs:
      - apk:
          context: rbd-cloud

  manual-long:
    when: << pipeline.parameters.run_long >>
    jobs:
      - long
