      <ellipse cx="166" cy="354" rx="6" ry="4"/>
      <ellipse cx="181" cy="357" rx="6" ry="4"/>
    </g>

    <g fill="#ffcc66" filter="url(#glowGold)" opacity="0.9">
      <circle cx="36" cy="24" r="4"/>
      <circle cx="330" cy="16" r="3"/>
      <circle cx="372" cy="290" r="3.5"/>
      <circle cx="8" cy="288" r="2.5"/>
    </g>
  </g>

  <text x="1180" y="405" text-anchor="end" font-family="'Courier New', monospace" font-size="9" letter-spacing="2" fill="#6f6188">HOUSE EDGE INCLUDED.</text>
</svg>
