<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Rigged by Design – begehbare Lebenssimulation</title>
  <desc id="banner-desc">Neon-Banner mit drei Wohnhäusern an einer nächtlichen Straße, einer Laterne, einer gehenden Figur vor einer beleuchteten Haustür und dem Titel Rigged by Design.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050d"/>
      <stop offset="0.55" stop-color="#120a22"/>
      <stop offset="1" stop-color="#1b092b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.76" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07050d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="streetGlow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#00ffcc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="0.38" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#d58a1f"/>
    </linearGradient>
    <linearGradient id="pinkTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3d4"/>
      <stop offset="0.5" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#b34bff"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffcc"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffcc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="doorLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1230"/>
      <stop offset="1" stop-color="#0c0715"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8b5cf6" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#halo)"/>
  <rect x="620" width="660" height="420" fill="url(#grid)" opacity="0.65"/>
  <rect y="240" width="1280" height="180" fill="url(#streetGlow)"/>

  <path d="M 0 1 H 1280" stroke="url(#cyanLine)" stroke-width="1" opacity="0.55"/>
  <path d="M 38 38 H 86 M 38 38 V 86" fill="none" stroke="#ff2d95" stroke-width="1.5" opacity="0.65"/>
  <path d="M 1242 38 H 1194 M 1242 38 V 86" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.45"/>

  <g font-family="'Courier New', monospace" fill="#8d7fa8">
    <rect x="70" y="66" width="8" height="8" fill="#00ffcc"/>
    <text x="90" y="75" font-size="12" letter-spacing="3.4" fill="#bfb2d6">BEGEHBARE LEBENSSIMULATION</text>
    <text x="90" y="96" font-size="10" letter-spacing="2.2" fill="#6f6188">BROWSER BUILD / SINGLE PLAYER / FRAGWUERDIGE ENTSCHEIDUNGEN</text>
  </g>

  <g filter="url(#textShadow)" font-family="Arial Black, Arial, sans-serif" font-weight="900">
    <text x="70" y="174" font-size="96" letter-spacing="1" fill="url(#gold)">RIGGED</text>
    <text x="70" y="264" font-size="96" letter-spacing="1" fill="url(#pinkTitle)">BY DESIGN</text>
  </g>

  <rect x="70" y="284" width="112" height="3" fill="url(#cyanLine)"/>
  <text x="70" y="313" font-family="'Courier New', monospace" font-size="19" fill="#d8cdea">Die Stadt war schon da, bevor du aufgewacht bist.</text>

  <g transform="translate(70 334)" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.4">
    <g>
      <rect width="206" height="28" rx="14" fill="#0f0a1b" stroke="#3b2c58"/>
      <circle cx="17" cy="14" r="3" fill="#00ffcc"/>
      <text x="30" y="18" fill="#b9f8ea">WOHNUNG, STRASSE, STADT</text>
    </g>
    <g transform="translate(220 0)">
      <rect width="226" height="28" rx="14" fill="#0f0a1b" stroke="#3b2c58"/>
      <circle cx="17" cy="14" r="3" fill="#ffcc66"/>
      <text x="30" y="18" fill="#f4dfaf">BEWOHNER MIT GEDAECHTNIS</text>
    </g>
    <g transform="translate(460 0)">
      <rect width="154" height="28" rx="14" fill="#0f0a1b" stroke="#3b2c58"/>
      <circle cx="17" cy="14" r="3" fill="#ff2d95"/>
      <text x="30" y="18" fill="#ffb3d4">KEIN ECHTGELD</text>
    </g>
  </g>

  <path d="M 70 384 H 610" stroke="#2c2440" stroke-width="1"/>
  <text x="70" y="405" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.2" fill="#6f6188">FIKTIVES GELD. ECHTE SCHLECHTE ENTSCHEIDUNGEN.</text>

  <g>
    <path d="M 660 380 H 1280" stroke="#241633" stroke-width="2"/>
    <path d="M 660 380 L 700 420 M 780 380 L 760 420 M 900 380 L 880 420 M 1020 380 L 1000 420 M 1140 380 L 1120 420 M 1240 380 L 1240 420" stroke="#241633" stroke-width="1.5" opacity="0.9"/>
    <rect y="380" width="1280" height="40" fill="#0a0713" opacity="0.85"/>
  </g>

  <g>
    <path d="M 666 150 L 751 106 L 836 150 Z" fill="url(#facade)" stroke="#3b2c58" stroke-width="1.5"/>
    <rect x="676" y="150" width="150" height="200" fill="url(#facade)" stroke="#3b2c58" stroke-width="1.5"/>
    <g fill="#ffd166" opacity="0.55">
      <rect x="692" y="170" width="22" height="26" rx="2"/>
      <rect x="726" y="170" width="22" height="26" rx="2"/>
      <rect x="760" y="170" width="22" height="26" rx="2"/>
      <rect x="692" y="212" width="22" height="26" rx="2"/>
      <rect x="760" y="212" width="22" height="26" rx="2"/>
      <rect x="692" y="254" width="22" height="26" rx="2"/>
      <rect x="726" y="254" width="22" height="26" rx="2"/>
    </g>
    <rect x="726" y="212" width="22" height="26" rx="2" fill="#00ffcc" opacity="0.6"/>
    <rect x="760" y="254" width="22" height="26" rx="2" fill="#8b5cf6" opacity="0.6"/>
  </g>

  <g>
    <path d="M 836 96 L 941 44 L 1046 96 Z" fill="url(#facade)" stroke="#3b2c58" stroke-width="1.5"/>
    <rect x="846" y="96" width="190" height="254" fill="url(#facade)" stroke="#3b2c58" stroke-width="1.5"/>
    <g fill="#ffd166" opacity="0.5">
      <rect x="864" y="120" width="24" height="30" rx="2"/>
      <rect x="902" y="120" width="24" height="30" rx="2"/>
      <rect x="940" y="120" width="24" height="30" rx="2"/>
      <rect x="978" y="120" width="24" height="30" rx="2"/>
      <rect x="864" y="166" width="24" height="30" rx="2"/>
      <rect x="940" y="166" width="24" height="30" rx="2"/>
      <rect x="978" y="166" width="24" height="30" rx="2"/>
      <rect x="864" y="212" width="24" height="30" rx="2"/>
      <rect x="902" y="212" width="24" height="30" rx="2"/>
      <rect x="978" y="212" width="24" height="30" rx="2"/>
    </g>
    <rect x="902" y="166" width="24" height="30" rx="2" fill="#00ffcc" opacity="0.55"/>
    <rect x="902" y="212" width="24" height="30" rx="2" fill="#ff2d95" opacity="0.5"/>
    <rect x="918" y="288" width="54" height="62" rx="3" fill="url(#doorLight)" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="960" cy="320" r="2.5" fill="#3a2410"/>
  </g>

  <g>
    <path d="M 1046 176 L 1131 132 L 1216 176 Z" fill="url(#facade)" stroke="#3b2c58" stroke-width="1.5"/>
    <rect x="1056" y="176" width="160" height="174" fill="url(#facade)" stroke="#3b2c58" stroke-width="1.5"/>
    <g fill="#ffd166" opacity="0.45">
      <rect x="1072" y="196" width="22" height="26" rx="2"/>
      <rect x="1106" y="196" width="22" height="26" rx="2"/>
      <rect x="1140" y="196" width="22" height="26" rx="2"/>
      <rect x="1174" y="196" width="22" height="26" rx="2"/>
      <rect x="1072" y="238" width="22" height="26" rx="2"/>
      <rect x="1140" y="238" width="22" height="26" rx="2"/>
      <rect x="1174" y="238" width="22" height="26" rx="2"/>
      <rect x="1106" y="280" width="22" height="26" rx="2"/>
      <rect x="1140" y="280" width="22" height="26" rx="2"/>
    </g>
    <rect x="1106" y="238" width="22" height="26" rx="2" fill="#00ffcc" opacity="0.5"/>
    <rect x="1174" y="280" width="22" height="26" rx="2" fill="#ff2d95" opacity="0.45"/>
  </g>

  <g>
    <rect x="804" y="214" width="6" height="150" fill="#2c2440"/>
    <path d="M 807 218 Q 807 198 831 198" fill="none" stroke="#2c2440" stroke-width="6"/>
    <circle cx="833" cy="198" r="8" fill="#00ffcc" filter="url(#glowCyan)"/>
    <path d="M 833 198 L 762 380 L 906 380 Z" fill="url(#cone)"/>
  </g>

  <g stroke="#d8cdea" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="990" cy="300" r="8" fill="#d8cdea" stroke="none"/>
    <path d="M 990 310 L 990 336"/>
    <path d="M 990 336 L 978 360 M 990 336 L 1002 356"/>
    <path d="M 990 318 L 976 330 M 990 318 L 1003 328"/>
  </g>

  <g fill="#ffcc66" filter="url(#glowCyan)" opacity="0.75">
    <circle cx="700" cy="404" r="2"/>
    <circle cx="940" cy="404" r="2"/>
    <circle cx="1180" cy="404" r="2"/>
  </g>

  <path d="M 0 419 H 1280" stroke="#2c2440" stroke-width="1"/>
  <text x="1210" y="405" text-anchor="end" font-family="'Courier New', monospace" font-size="9" letter-spacing="2" fill="#6f6188">ZUHAUSE ANFANGEN.</text>
</svg>
