<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Rigged by Design – Social Preview</title>
  <desc id="sp-desc">Social preview banner for the Rigged by Design satirical casino roguelite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07050d"/>
      <stop offset=".5" stop-color="#1b092b"/>
      <stop offset="1" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd166"/>
      <stop offset=".5" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#ffcc66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40H0" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Top and bottom neon lines -->
  <line x1="0" y1="12" x2="1280" y2="12" stroke="#ff2d95" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="0" y1="628" x2="1280" y2="628" stroke="#ff2d95" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Corner decorations -->
  <rect x="20" y="20" width="8" height="8" fill="#00ffcc" opacity="0.5"/>
  <rect x="1252" y="20" width="8" height="8" fill="#00ffcc" opacity="0.5"/>
  <rect x="20" y="612" width="8" height="8" fill="#00ffcc" opacity="0.5"/>
  <rect x="1252" y="612" width="8" height="8" fill="#00ffcc" opacity="0.5"/>

  <!-- Main title: RIGGED BY DESIGN -->
  <text x="80" y="230" fill="url(#titleGrad)" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" letter-spacing="6" filter="url(#glow)">RIGGED BY</text>
  <text x="80" y="320" fill="url(#titleGrad)" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" letter-spacing="6" filter="url(#glow)">DESIGN</text>

  <!-- Subtitle -->
  <text x="85" y="365" fill="#ffb3d4" font-family="Consolas, 'Courier New', monospace" font-size="22" letter-spacing="4" opacity="0.9">VACOIN CASINO ROGUELITE</text>

  <!-- Tagline -->
  <text x="85" y="405" fill="#63fff0" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="2" opacity="0.8">Eine satirische Lebenssimulation</text>

  <!-- Slot Machine Silhouette (right side) -->
  <g transform="translate(880, 80)" filter="url(#glowSoft)">
    <!-- Machine body -->
    <rect x="40" y="40" width="260" height="360" rx="18" fill="#120a22" stroke="#ff2d95" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Top arch -->
    <path d="M60 60 Q170 -20 280 60" fill="none" stroke="#ffd166" stroke-width="4" stroke-opacity="0.7"/>
    <!-- Display window -->
    <rect x="70" y="90" width="200" height="130" rx="8" fill="#0a0515" stroke="#63fff0" stroke-width="2"/>
    <!-- Three reel slots -->
    <rect x="82" y="100" width="55" height="110" rx="4" fill="#1b092b" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="143" y="100" width="55" height="110" rx="4" fill="#1b092b" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="204" y="100" width="55" height="110" rx="4" fill="#1b092b" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Reel symbols: 7, ♦, 7 -->
    <text x="109" y="168" text-anchor="middle" fill="#ff2d95" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900">7</text>
    <text x="170" y="168" text-anchor="middle" fill="#ffd166" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900">♦</text>
    <text x="231" y="168" text-anchor="middle" fill="#a5ff6b" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900">7</text>
    <!-- Coin slot -->
    <rect x="150" y="240" width="40" height="6" rx="3" fill="#ffcc66" opacity="0.7"/>
    <!-- Buttons -->
    <circle cx="120" cy="290" r="16" fill="#1b092b" stroke="#ff2d95" stroke-width="2"/>
    <circle cx="170" cy="290" r="16" fill="#1b092b" stroke="#ffd166" stroke-width="2"/>
    <circle cx="220" cy="290" r="16" fill="#1b092b" stroke="#a5ff6b" stroke-width="2"/>
    <!-- Lever -->
    <line x1="320" y1="100" x2="320" y2="220" stroke="#ffcc66" stroke-width="6" stroke-linecap="round"/>
    <circle cx="320" cy="90" r="14" fill="#ff2d95"/>
    <!-- Base -->
    <rect x="55" y="350" width="230" height="35" rx="6" fill="#120a22" stroke="#ffd166" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Coin tray -->
    <rect x="100" y="360" width="140" height="15" rx="4" fill="#0a0515" stroke="#ffcc66" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Scattered coins -->
    <circle cx="130" cy="367" r="4" fill="#ffcc66" opacity="0.6"/>
    <circle cx="145" cy="370" r="3" fill="#ffd166" opacity="0.5"/>
    <circle cx="200" cy="368" r="4" fill="#ffcc66" opacity="0.6"/>
  </g>

  <!-- Three pill badges -->
  <g transform="translate(85, 450)">
    <!-- Badge 1: DETERMINISTIC RNG -->
    <rect width="230" height="38" rx="19" fill="#120a22" stroke="#00ffcc" stroke-width="2"/>
    <text x="115" y="25" text-anchor="middle" fill="#00ffcc" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">DETERMINISTIC RNG</text>

    <!-- Badge 2: DOUBLE-ENTRY LEDGER -->
    <rect x="250" width="240" height="38" rx="19" fill="#120a22" stroke="#ffd166" stroke-width="2"/>
    <text x="370" y="25" text-anchor="middle" fill="#ffd166" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">DOUBLE-ENTRY LEDGER</text>

    <!-- Badge 3: NO REAL MONEY -->
    <rect x="510" width="200" height="38" rx="19" fill="#120a22" stroke="#a5ff6b" stroke-width="2"/>
    <text x="610" y="25" text-anchor="middle" fill="#a5ff6b" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">NO REAL MONEY</text>
  </g>

  <!-- Bottom decorative dots -->
  <g opacity="0.3">
    <circle cx="85" cy="570" r="3" fill="#ff2d95"/>
    <circle cx="100" cy="570" r="3" fill="#ffd166"/>
    <circle cx="115" cy="570" r="3" fill="#00ffcc"/>
    <circle cx="130" cy="570" r="3" fill="#a5ff6b"/>
    <circle cx="145" cy="570" r="3" fill="#ff2d95"/>
  </g>
</svg>
