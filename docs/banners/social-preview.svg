<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Rigged by Design – Social Preview</title>
  <desc id="sp-desc">Social preview banner for Rigged by Design: neon night street with apartment houses, a street lamp and a walking resident.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07050d"/>
      <stop offset=".5" stop-color="#1b092b"/>
      <stop offset="1" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd166"/>
      <stop offset=".5" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#ffcc66"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22143a"/>
      <stop offset="1" stop-color="#0c0715"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffcc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40H0" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <line x1="0" y1="12" x2="1280" y2="12" stroke="#ff2d95" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="0" y1="628" x2="1280" y2="628" stroke="#ff2d95" stroke-width="3" stroke-opacity="0.6"/>

  <rect x="20" y="20" width="8" height="8" fill="#00ffcc" opacity="0.5"/>
  <rect x="1252" y="20" width="8" height="8" fill="#00ffcc" opacity="0.5"/>
  <rect x="20" y="612" width="8" height="8" fill="#00ffcc" opacity="0.5"/>
  <rect x="1252" y="612" width="8" height="8" fill="#00ffcc" opacity="0.5"/>

  <text x="80" y="230" fill="url(#titleGrad)" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" letter-spacing="6" filter="url(#glow)">RIGGED BY</text>
  <text x="80" y="320" fill="url(#titleGrad)" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" letter-spacing="6" filter="url(#glow)">DESIGN</text>

  <text x="85" y="365" fill="#ffb3d4" font-family="Consolas, 'Courier New', monospace" font-size="22" letter-spacing="4" opacity="0.9">BEGEHBARE LEBENSSIMULATION</text>

  <text x="85" y="405" fill="#63fff0" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="2" opacity="0.8">Wohnung. Straße. Stadt. Bewohner.</text>

  <g transform="translate(760 96)">
    <rect y="400" width="470" height="14" fill="#0a0713" opacity="0.9"/>
    <path d="M 40 148 L 128 104 L 216 148 Z" fill="url(#facade)" stroke="#3b2c58" stroke-width="2" filter="url(#glowSoft)"/>
    <rect x="52" y="148" width="152" height="252" fill="url(#facade)" stroke="#3b2c58" stroke-width="2"/>
    <g fill="#ffd166" opacity="0.55">
      <rect x="70" y="170" width="24" height="28" rx="2"/>
      <rect x="106" y="170" width="24" height="28" rx="2"/>
      <rect x="142" y="170" width="24" height="28" rx="2"/>
      <rect x="70" y="214" width="24" height="28" rx="2"/>
      <rect x="142" y="214" width="24" height="28" rx="2"/>
      <rect x="70" y="258" width="24" height="28" rx="2"/>
      <rect x="106" y="258" width="24" height="28" rx="2"/>
    </g>
    <rect x="106" y="214" width="24" height="28" rx="2" fill="#00ffcc" opacity="0.6"/>
    <rect x="142" y="258" width="24" height="28" rx="2" fill="#8b5cf6" opacity="0.6"/>

    <path d="M 236 96 L 345 44 L 454 96 Z" fill="url(#facade)" stroke="#3b2c58" stroke-width="2"/>
    <rect x="248" y="96" width="194" height="304" fill="url(#facade)" stroke="#3b2c58" stroke-width="2"/>
    <g fill="#ffd166" opacity="0.5">
      <rect x="266" y="122" width="26" height="32" rx="2"/>
      <rect x="306" y="122" width="26" height="32" rx="2"/>
      <rect x="346" y="122" width="26" height="32" rx="2"/>
      <rect x="386" y="122" width="26" height="32" rx="2"/>
      <rect x="266" y="172" width="26" height="32" rx="2"/>
      <rect x="346" y="172" width="26" height="32" rx="2"/>
      <rect x="386" y="172" width="26" height="32" rx="2"/>
      <rect x="266" y="222" width="26" height="32" rx="2"/>
      <rect x="306" y="222" width="26" height="32" rx="2"/>
      <rect x="386" y="222" width="26" height="32" rx="2"/>
    </g>
    <rect x="306" y="172" width="26" height="32" rx="2" fill="#00ffcc" opacity="0.55"/>
    <rect x="306" y="222" width="26" height="32" rx="2" fill="#ff2d95" opacity="0.5"/>
    <rect x="322" y="306" width="58" height="76" rx="3" fill="#ffb35c" opacity="0.75" stroke="#ffd166" stroke-width="2"/>
    <circle cx="368" cy="344" r="3" fill="#3a2410"/>

    <rect x="214" y="230" width="6" height="170" fill="#2c2440"/>
    <path d="M 217 234 Q 217 212 243 212" fill="none" stroke="#2c2440" stroke-width="6"/>
    <circle cx="245" cy="212" r="9" fill="#00ffcc" filter="url(#glow)"/>
    <path d="M 245 212 L 176 400 L 322 400 Z" fill="url(#cone)"/>

    <g stroke="#d8cdea" stroke-width="8" stroke-linecap="round" fill="none">
      <circle cx="410" cy="326" r="9" fill="#d8cdea" stroke="none"/>
      <path d="M 410 338 L 410 366"/>
      <path d="M 410 366 L 396 396 M 410 366 L 424 392"/>
      <path d="M 410 346 L 394 360 M 410 346 L 425 358"/>
    </g>
  </g>

  <g transform="translate(85, 450)">
    <rect width="250" height="38" rx="19" fill="#120a22" stroke="#00ffcc" stroke-width="2"/>
    <text x="125" y="25" text-anchor="middle" fill="#00ffcc" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">WOHNUNG UND STRASSE</text>

    <rect x="270" width="260" height="38" rx="19" fill="#120a22" stroke="#ffd166" stroke-width="2"/>
    <text x="400" y="25" text-anchor="middle" fill="#ffd166" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">BEWOHNER MIT GEDÄCHTNIS</text>

    <rect x="550" width="190" height="38" rx="19" fill="#120a22" stroke="#a5ff6b" stroke-width="2"/>
    <text x="645" y="25" text-anchor="middle" fill="#a5ff6b" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">KEIN ECHTGELD</text>
  </g>

  <text x="85" y="570" fill="#8d7fa8" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">FIKTIVES GELD. ECHTE SCHLECHTE ENTSCHEIDUNGEN.</text>

  <g opacity="0.3">
    <circle cx="85" cy="600" r="3" fill="#ff2d95"/>
    <circle cx="100" cy="600" r="3" fill="#ffd166"/>
    <circle cx="115" cy="600" r="3" fill="#00ffcc"/>
    <circle cx="130" cy="600" r="3" fill="#a5ff6b"/>
    <circle cx="145" cy="600" r="3" fill="#ff2d95"/>
  </g>
</svg>
